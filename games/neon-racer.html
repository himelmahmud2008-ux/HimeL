<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Drift | VORTEX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080512;color:#f5edff;font-family:system-ui,sans-serif;touch-action:none}
#game{display:block;width:100%;height:100%;background:#090615}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 8px #000}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#080512bb;text-align:center;padding:20px}
.panel{max-width:360px;padding:24px;border:1px solid #9b4dff;border-radius:18px;background:#160d29;box-shadow:0 0 35px #7624cf88}
h1{margin:0 0 8px;color:#d9a5ff;letter-spacing:2px}p{color:#c4b4dc;line-height:1.5}
button{border:0;border-radius:12px;padding:12px 24px;background:linear-gradient(120deg,#822cff,#d32cff);color:white;font-size:16px;font-weight:800}
#controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.ctrl{pointer-events:auto;width:76px;height:58px;border:1px solid #c18aff88;background:#291344cc;color:white;border-radius:16px;font-size:25px;touch-action:none}
small{color:#a995c3}
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Drift racing game"></canvas>
<div id="hud"><span>🏁 NEON DRIFT</span><span>SCORE: <b id="score">0</b></span></div>
<div id="overlay"><div class="panel"><h1>NEON DRIFT</h1><p>Dodge the traffic and survive as long as you can.<br>Use ← → or A / D. On mobile, use the buttons.</p><button id="start">START RACE</button><p><small>Original VORTEX mini-game</small></p></div></div>
<div id="controls"><button class="ctrl" id="left" aria-label="Steer left">◀</button><button class="ctrl" id="right" aria-label="Steer right">▶</button></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay');
let w=0,h=0,player,traffic,score,alive=false,last=0,spawn=0,keys={};
const lanes=3;
function resize(){const d=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);if(player)player.y=h-105}
window.addEventListener('resize',resize);resize();
function road(){const rw=Math.min(w*.72,420),x=(w-rw)/2;ctx.fillStyle='#171027';ctx.fillRect(x,0,rw,h);ctx.fillStyle='#30204a';ctx.fillRect(x-5,0,5,h);ctx.fillRect(x+rw,0,5,h);ctx.strokeStyle='#8e54c9';ctx.lineWidth=2;ctx.setLineDash([24,22]);ctx.lineDashOffset=-(score*0.55)%46;for(let i=1;i<lanes;i++){let lx=x+rw*i/lanes;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,h);ctx.stroke()}ctx.setLineDash([]);return{rw,x}}
function car(x,y,color,playerCar=false){ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=16;ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-14,-24,28,48,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#171027';ctx.fillRect(-9,-13,18,13);ctx.fillStyle='#fff';ctx.fillRect(-10,17,5,4);ctx.fillRect(5,17,5,4);if(playerCar){ctx.fillStyle='#fff';ctx.fillRect(-9,-20,5,4);ctx.fillRect(4,-20,5,4)}ctx.restore()}
function reset(){const r=road();player={lane:1,x:r.x+r.rw/2,y:h-105};traffic=[];score=0;spawn=0;scoreEl.textContent='0';alive=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(frame)}
function move(dir){if(!alive)return;player.lane=Math.max(0,Math.min(2,player.lane+dir))}
function frame(now){if(!alive)return;const dt=Math.min((now-last)/16.67,2);last=now;ctx.clearRect(0,0,w,h);const r=road(),laneW=r.rw/3;player.x=r.x+laneW*(player.lane+.5);let speed=3.3+Math.min(score/180,4);spawn+=dt;if(spawn>Math.max(24,62-score/18)){spawn=0;let lane=Math.floor(Math.random()*3);traffic.push({lane,y:-45,color:['#ff3f91','#38d9ff','#ffc857'][Math.floor(Math.random()*3)]})
for(const t of traffic){t.y+=speed*dt;let tx=r.x+laneW*(t.lane+.5);car(tx,t.y,t.color);if(Math.abs(tx-player.x)<25&&Math.abs(t.y-player.y)<39){end();return}}
traffic=traffic.filter(t=>t.y<h+50);car(player.x,player.y,'#b66bff',true);score+=dt;scoreEl.textContent=Math.floor(score);requestAnimationFrame(frame)}
function end(){alive=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='RACE OVER';overlay.querySelector('p').innerHTML='Your score: <b>'+Math.floor(score)+'</b><br>Try again and beat your record!';document.getElementById('start').textContent='RACE AGAIN'}
document.getElementById('start').addEventListener('click',reset);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();if(!keys[e.key]){if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);else move(1)}keys[e.key]=true}});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
})();
</script>
</body>
</html>
