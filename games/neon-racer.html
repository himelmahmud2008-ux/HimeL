<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Drift 3D | VORTEX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030b;color:#f5edff;font-family:system-ui,sans-serif;touch-action:none}
#scene{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px;font-weight:800;text-shadow:0 2px 9px #000;pointer-events:none}
#hud span{background:#10091dcc;border:1px solid #9b4dff66;border-radius:10px;padding:7px 11px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08051299;text-align:center;padding:18px}
.panel{max-width:390px;padding:24px;border:1px solid #9b4dff;border-radius:18px;background:#160d29ed;box-shadow:0 0 35px #7624cf88}
h1{margin:0 0 8px;color:#d9a5ff;letter-spacing:2px}p{color:#c4b4dc;line-height:1.5}
button{border:0;border-radius:12px;padding:12px 24px;background:linear-gradient(120deg,#822cff,#d32cff);color:white;font-size:16px;font-weight:800}
#controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.ctrl{pointer-events:auto;width:76px;height:58px;border:1px solid #c18aff99;background:#291344dd;color:white;border-radius:16px;font-size:25px;touch-action:none}
small{color:#a995c3}#error{display:none;color:#ffb6d4;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud"><span>🏁 NEON DRIFT 3D</span><span>SCORE: <b id="score">0</b></span></div>
<div id="overlay"><div class="panel"><h1>NEON DRIFT 3D</h1><p>A 3D night-drive challenge. Dodge traffic, switch lanes and beat your high score.<br><br>Keyboard: ← → or A / D<br>Mobile: use the arrow buttons</p><button id="start">START RACE</button><div id="error"></div><p><small>Original 3D VORTEX game</small></p></div></div>
<div id="controls"><button class="ctrl" id="left" aria-label="Steer left">◀</button><button class="ctrl" id="right" aria-label="Steer right">▶</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
(()=>{
const host=document.getElementById('scene'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),errorEl=document.getElementById('error');
let renderer,scene,camera,player,roadMarks=[],traffic=[],buildings=[],running=false,score=0,last=0,spawn=0,lane=1,targetX=0;
const laneX=[-3.15,0,3.15],clock=new THREE.Clock();
const mat=(color,emissive=color,intensity=.18)=>new THREE.MeshStandardMaterial({color,roughness:.48,metalness:.35,emissive,emissiveIntensity:intensity});
const mats={road:mat(0x100d1d,0x21113d,.25),line:mat(0xc68aff,0x8e32ff,1.8),cyan:mat(0x36dfff,0x08bde8,1.2),pink:mat(0xff3d9a,0xd20b69,1.2),purple:mat(0x9b59ff,0x7025e8,1.2),glass:mat(0x152b4b,0x102a56,.6),white:mat(0xe9e4ff,0xb9aaff,.3),tire:mat(0x090a12,0x05050a,.05)};
function box(parent,w,h,d,material,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);parent.add(mesh);return mesh}
function makeCar(color){
 const group=new THREE.Group(),bodyMat=mat(color,color,.75);
 box(group,1.65,.48,3.1,bodyMat,0,.62,0);
 box(group,1.28,.55,1.48,mats.glass,0,1.08,-.15);
 box(group,1.5,.12,.28,mats.white,0,.48,-1.48);
 box(group,.34,.18,.08,mats.white,-.48,.7,-1.57);box(group,.34,.18,.08,mats.white,.48,.7,-1.57);
 const wheelGeo=new THREE.CylinderGeometry(.34,.34,.22,16);
 for(const x of [-.86,.86])for(const z of [-.95,.98]){const wh=new THREE.Mesh(wheelGeo,mats.tire);wh.rotation.z=Math.PI/2;wh.position.set(x,.36,z);group.add(wh)}
 const glow=new THREE.PointLight(color,5,5);glow.position.set(0,.8,0);group.add(glow);
 return group;
}
function init(){
 try{
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;host.appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x070512);scene.fog=new THREE.Fog(0x070512,28,115);
 camera=new THREE.PerspectiveCamera(58,host.clientWidth/host.clientHeight,.1,180);camera.position.set(0,8.5,13);camera.lookAt(0,0,-13);
 scene.add(new THREE.HemisphereLight(0x9d8aff,0x100819,2));
 const sun=new THREE.DirectionalLight(0xdacaff,2.2);sun.position.set(-5,12,8);scene.add(sun);
 const road=new THREE.Mesh(new THREE.PlaneGeometry(12,180),mats.road);road.rotation.x=-Math.PI/2;road.position.set(0,-.04,-65);scene.add(road);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,220),mat(0x080611,0x080611,.1));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.12,-60);scene.add(ground);
 for(const x of [-6.1,6.1]){const rail=box(scene,.12,.18,180,mats.pink,x,.15,-65);rail.material=mats.cyan}
 for(let z=8;z>-150;z-=9){for(const x of [-2,2]){const mark=box(scene,.075,.025,3.2,mats.line,x,.015,z);roadMarks.push(mark)}}
 for(let side of [-1,1])for(let z=-145;z<20;z+=13+Math.random()*9){const height=5+Math.random()*18,width=3+Math.random()*5;const b=box(scene,width,height,width,mat(side<0?0x17102d:0x101a32,side<0?0x32105b:0x0b2e55,.55),side*(10+Math.random()*9),height/2-.1,z);buildings.push(b);for(let y=1;y<height-1;y+=2.5){const win=box(scene,width*.68,.08,.04,side<0?mats.pink:mats.cyan,b.position.x,y,z-width/2-.03);win.material=win.material.clone()}}
 player=makeCar(0xa94dff);player.position.set(0,0,5);scene.add(player);
 window.addEventListener('resize',resize);
 animate();
 }catch(err){errorEl.style.display='block';errorEl.textContent='3D graphics could not start in this browser. Try Chrome with hardware acceleration enabled.';startBtn.disabled=true;console.error(err)}
}
function resize(){if(!renderer)return;const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
function addTraffic(){
 const colors=[0xff3d91,0x32d9ff,0xffc857,0x9b63ff];const car=makeCar(colors[Math.floor(Math.random()*colors.length)]);
 car.scale.setScalar(.88);car.position.set(laneX[Math.floor(Math.random()*3)],0,-95);scene.add(car);traffic.push(car);
}
function move(dir){if(!running)return;lane=Math.max(0,Math.min(2,lane+dir));targetX=laneX[lane]}
function reset(){traffic.forEach(c=>scene.remove(c));traffic=[];score=0;spawn=0;lane=1;targetX=0;player.position.x=0;scoreEl.textContent='0';overlay.style.display='none';running=true;last=performance.now()}
function finish(){running=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='RACE OVER';overlay.querySelector('p').innerHTML='Your score: <b>'+Math.floor(score)+'</b><br>Switch lanes faster and try again!';startBtn.textContent='RACE AGAIN'}
function animate(now=0){requestAnimationFrame(animate);if(!renderer)return;const dt=Math.min(clock.getDelta(),.045);if(running){
 score+=dt*12;scoreEl.textContent=Math.floor(score);const speed=24+Math.min(score*.12,20);spawn+=dt;
 if(spawn>Math.max(.48,1.15-score*.002)){spawn=0;addTraffic()}
 roadMarks.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>12)m.position.z=-150});
 buildings.forEach(b=>{b.position.z+=speed*dt*.75;if(b.position.z>25)b.position.z=-155-Math.random()*20});
 player.position.x+=(targetX-player.position.x)*Math.min(1,dt*12);
 traffic.forEach(c=>{c.position.z+=speed*dt;if(Math.abs(c.position.x-player.position.x)<1.45&&Math.abs(c.position.z-player.position.z)<2.35){finish()}});
 traffic=traffic.filter(c=>{if(c.position.z>18){scene.remove(c);return false}return true});
 camera.position.x+=(player.position.x*.16-camera.position.x)*dt*2;camera.lookAt(player.position.x*.12,0,-13);
 }renderer.render(scene,camera)}
startBtn.addEventListener('click',reset);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();if(!e.repeat)move(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'?-1:1)}});
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
init();
})();
</script>
</body>
</html>
