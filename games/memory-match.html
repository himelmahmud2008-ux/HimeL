<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match — VORTEX</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080512;color:#f5edff;font:16px system-ui;padding:16px}.game{width:min(520px,100%);text-align:center}h2{color:#d7b8ff}.top{display:flex;justify-content:space-between;color:#cbb9ef;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:1px solid #7046a7;border-radius:12px;background:linear-gradient(145deg,#34204e,#171026);font-size:clamp(23px,7vw,38px);display:grid;place-items:center;cursor:pointer;user-select:none;transition:transform .15s}.card.open,.card.done{background:#39265a;border-color:#c084fc}.card.done{opacity:.55}.actions button{margin:14px 0;background:#7b35db;color:white;border:0;border-radius:10px;padding:11px 20px;font-weight:bold}.msg{min-height:24px;color:#d8baff}p{color:#a99abb;font-size:13px}</style><main class="game"><h2>🧠 MEMORY MATCH</h2><div class="top"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/8</span><span>Time: <b id="time">0</b>s</span></div><div class="grid" id="grid"></div><div class="msg" id="msg"></div><div class="actions"><button id="again">New game</button></div><p>Find all matching pairs. Tap or click two cards at a time.</p></main><script>
const icons=['🚀','🎮','👾','💎','⭐','🎧','🔥','🌙'];let deck=[],first=null,lock=false,moves=0,pairs=0,secs=0,timer=null,started=false;const grid=document.querySelector('#grid');function startClock(){if(started)return;started=true;timer=setInterval(()=>{secs++;document.querySelector('#time').textContent=secs},1000)}function setup(){clearInterval(timer);started=false;secs=moves=pairs=0;first=null;lock=false;document.querySelector('#moves').textContent=0;document.querySelector('#pairs').textContent=0;document.querySelector('#time').textContent=0;document.querySelector('#msg').textContent='';deck=[...icons,...icons].sort(()=>Math.random()-.5);grid.innerHTML=deck.map((v,i)=>'<button class="card" data-i="'+i+'" aria-label="Hidden card">?</button>').join('')}grid.addEventListener('click',e=>{let b=e.target.closest('.card');if(!b||lock||b.classList.contains('open')||b.classList.contains('done'))return;startClock();let i=+b.dataset.i;b.textContent=deck[i];b.classList.add('open');if(first===null){first=b;return}moves++;document.querySelector('#moves').textContent=moves;if(deck[+first.dataset.i]===deck[i]){first.classList.add('done');b.classList.add('done');first.classList.remove('open');b.classList.remove('open');first=null;pairs++;document.querySelector('#pairs').textContent=pairs;if(pairs===8){clearInterval(timer);document.querySelector('#msg').textContent='You matched every pair in '+moves+' moves!'}}else{lock=true;let prev=first;first=null;setTimeout(()=>{prev.textContent='?';b.textContent='?';prev.classList.remove('open');b.classList.remove('open');lock=false},700)}});document.querySelector('#again').onclick=setup;setup();
</script></html>
