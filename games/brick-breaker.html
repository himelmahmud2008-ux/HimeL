<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Prism Breaker — VORTEX</title><style>*{box-sizing:border-box}body{margin:0;background:#080512;color:#f4edff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:14px}.game{width:min(560px,100%);text-align:center}.top{display:flex;justify-content:space-between;margin:8px;color:#d8c9f5}canvas{width:100%;height:auto;aspect-ratio:4/5;background:#100b20;border:1px solid #6840a8;border-radius:16px;touch-action:none;display:block}button{background:#7b35db;color:white;border:0;border-radius:10px;padding:11px 20px;font-weight:700;margin:10px}.hint{color:#a99abb;font-size:13px}</style><div class="game"><h2>💎 PRISM BREAKER</h2><div class="top"><span>Score: <b id="s">0</b></span><span>Lives: <b id="l">3</b></span></div><canvas id="c" width="480" height="600"></canvas><button id="go">Start / Restart</button><p class="hint">Move with mouse, touch or ← →. Break every block!</p></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let p,b,bricks,s=0,l=3,on=false,raf,status='ready';function reset(){p={x:205,y:560,w:70};b={x:240,y:530,dx:3,dy:-4,r:9};bricks=[];for(let row=0;row<5;row++)for(let col=0;col<8;col++)bricks.push({x:12+col*57,y:55+row*27,w:50,h:17,alive:true});s=0;l=3;status='ready';document.querySelector('#s').textContent=s;document.querySelector('#l').textContent=l}
function draw(){g.clearRect(0,0,480,600);bricks.forEach((a,i)=>{if(!a.alive)return;g.fillStyle=['#8b5cf6','#d946ef','#22d3ee','#fb7185','#a3e635'][Math.floor(i/8)];g.shadowColor=g.fillStyle;g.shadowBlur=10;g.fillRect(a.x,a.y,a.w,a.h)});g.shadowBlur=16;g.shadowColor='#31e6ff';g.fillStyle='#31e6ff';g.fillRect(p.x,p.y,p.w,12);g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fillStyle='#fff';g.fill();g.shadowBlur=0;if(!on){g.fillStyle='#fff';g.textAlign='center';g.font='bold 22px system-ui';g.fillText(status==='win'?'YOU WIN!':status==='gameover'?'GAME OVER':'PRISM BREAKER',240,320);if(status==='gameover'||status==='win'){g.font='16px system-ui';g.fillText('Press Start / Restart to play again',240,350)}}}
function step(){if(!on)return;b.x+=b.dx;b.y+=b.dy;if(b.x<9||b.x>471)b.dx*=-1;if(b.y<9)b.dy=Math.abs(b.dy);if(b.y+b.r>=p.y&&b.x>=p.x&&b.x<=p.x+p.w){b.dy=-Math.abs(b.dy);b.dx+=(b.x-(p.x+p.w/2))/22}bricks.forEach(a=>{if(a.alive&&b.x>a.x&&b.x<a.x+a.w&&b.y-b.r<a.y+a.h&&b.y+b.r>a.y){a.alive=false;b.dy*=-1;s+=10;document.querySelector('#s').textContent=s}});if(b.y>610){l--;document.querySelector('#l').textContent=l;if(l<=0){on=false;status='gameover'}else{b={x:240,y:520,dx:3,dy:-4}}}if(bricks.every(a=>!a.alive)){on=false;status='win'}draw();if(on)raf=requestAnimationFrame(step)}
function move(x){p.x=Math.max(0,Math.min(480-p.w,x-p.w/2));draw()}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();move((e.clientX-r.left)*480/r.width)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(p.x-18+p.w/2);if(e.key==='ArrowRight')move(p.x+18+p.w/2)});document.querySelector('#go').onclick=()=>{cancelAnimationFrame(raf);reset();on=true;status='playing';draw();step()};reset();draw();
</script></html>
