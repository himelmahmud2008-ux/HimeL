<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Drift — VORTEX</title><style>
*{box-sizing:border-box}body{margin:0;background:#080512;color:#f4edff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:14px}.game{width:min(560px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#cbb9ef}canvas{width:100%;height:auto;aspect-ratio:3/4;background:linear-gradient(90deg,#100b20,#17102a,#100b20);border:1px solid #6840a8;border-radius:16px;display:block;touch-action:none}.bar{display:flex;justify-content:center;gap:12px;margin:12px}.bar button{background:#7b35db;color:white;border:0;border-radius:10px;padding:11px 20px;font-weight:700}.hint{color:#a99abb;font-size:13px}.pad{display:flex;justify-content:center;gap:26px}.pad button{width:76px;height:48px;background:#24143c;color:white;border:1px solid #7546ad;border-radius:12px;font-size:22px}
</style><div class="game"><h2>⚡ NEON DRIFT</h2><div class="top"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div><canvas id="c" width="480" height="640"></canvas><div class="bar"><button id="start">Start / Restart</button></div><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><p class="hint">Dodge the incoming blocks. Use ← → or A / D, or touch the controls.</p></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let lane=1,blocks=[],score=0,best=+(localStorage.ndBest||0),live=false,last=0,speed=260,spawn=0;bestEl.textContent=best;
function draw(){x.clearRect(0,0,480,640);x.fillStyle='#17102a';x.fillRect(55,0,370,640);x.strokeStyle='#6e4b9d';x.setLineDash([24,20]);x.lineWidth=3;for(let i=1;i<3;i++){x.beginPath();x.moveTo(55+i*123,0);x.lineTo(55+i*123,640);x.stroke()}x.setLineDash([]);x.fillStyle='#31e6ff';x.shadowColor='#31e6ff';x.shadowBlur=18;x.fillRect(76+lane*123,535,78,70);x.shadowBlur=0;x.fillStyle='#d62bff';blocks.forEach(b=>{x.shadowColor='#d62bff';x.shadowBlur=15;x.fillRect(76+b.l*123,b.y,78,65)});x.shadowBlur=0;if(!live){x.fillStyle='#fff';x.textAlign='center';x.font='bold 25px system-ui';x.fillText('READY TO RACE?',240,300);x.font='16px system-ui';x.fillText('Press Start',240,333)}}
function end(){live=false;if(score>best){best=score;localStorage.ndBest=best;bestEl.textContent=best}draw()}
function frame(t){if(!live)return;let dt=Math.min((t-last)/1000,.04);last=t;score+=dt*10;scoreEl.textContent=Math.floor(score);speed=260+score*1.8;spawn-=dt;if(spawn<=0){blocks.push({l:Math.floor(Math.random()*3),y:-75});spawn=Math.max(.32,.85-score/250)}blocks.forEach(b=>b.y+=speed*dt);blocks=blocks.filter(b=>b.y<680);if(blocks.some(b=>b.l===lane&&b.y+65>535&&b.y<605)){end();return}draw();requestAnimationFrame(frame)}
function move(d){lane=Math.max(0,Math.min(2,lane+d));if(!live)draw()}document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);document.querySelector('#start').onclick=()=>{lane=1;blocks=[];score=0;spawn=0;speed=260;scoreEl.textContent=0;live=true;last=performance.now();requestAnimationFrame(frame)};addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1)});draw();
</script></html>
