<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 Neon — VORTEX</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080512;color:#f5edff;font:16px system-ui;padding:16px}.game{width:min(460px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{color:#c7a4ff}button{border:0;border-radius:10px;background:#7b35db;color:white;padding:10px 16px;font-weight:bold}.stats{display:flex;gap:10px;margin:12px 0}.stats span{background:#201534;border:1px solid #56377c;padding:8px 14px;border-radius:10px}.board{background:#241a35;border:1px solid #67449b;border-radius:14px;padding:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;touch-action:pan-y}.tile{aspect-ratio:1;border-radius:9px;background:#392d4d;display:grid;place-items:center;font-size:clamp(20px,7vw,34px);font-weight:800;color:#fff}.v2{background:#7352a4}.v4{background:#8b5cf6}.v8{background:#b34ee4}.v16{background:#d946a8}.v32{background:#e85b78}.v64{background:#e58a4b}.v128,.v256,.v512,.v1024,.v2048{background:#d4a72c;color:#201526;font-size:clamp(17px,5vw,28px)}p{color:#b9a8d0;font-size:14px}.status{text-align:center;min-height:25px;margin:8px}</style><main class="game"><header><h1>2048 NEON</h1><button id="new">New game</button></header><div class="stats"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div><div class="board" id="board"></div><div class="status" id="status"></div><p>Join matching numbers to reach 2048. Use arrow keys or swipe on the board.</p></main><script>
let a=[],score=0,best=+(localStorage.v2048best||0),over=false;const board=document.querySelector('#board');document.querySelector('#best').textContent=best;function add(){let e=[];a.forEach((v,i)=>{if(!v)e.push(i)});if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}
function render(){board.innerHTML=a.map(v=>'<div class="tile '+(v?'v'+Math.min(v,2048):'')+'">'+(v||'')+'</div>').join('');document.querySelector('#score').textContent=score;document.querySelector('#best').textContent=best}
function move(dir){if(over)return;let old=a.join(',');for(let n=0;n<4;n++){let ids=Array.from({length:4},(_,i)=>dir==='left'?n*4+i:dir==='right'?n*4+3-i:dir==='up'?i*4+n:(3-i)*4+n),vals=ids.map(i=>a[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){let v=vals[i]*2;out.push(v);score+=v;i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>a[id]=out[i])}if(old!==a.join(',')){add();if(score>best){best=score;localStorage.v2048best=best}render();if(!a.some(v=>!v)&&!a.some((v,i)=>i%4<3&&v===a[i+1]||i<12&&v===a[i+4])){over=true;document.querySelector('#status').textContent='No moves left — start a new game.'}else if(a.includes(2048)){document.querySelector('#status').textContent='2048 reached! Keep playing or start again.'}}}
function reset(){a=Array(16).fill(0);score=0;over=false;document.querySelector('#status').textContent='';add();add();render()}addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});document.querySelector('#new').onclick=reset;reset();
</script></html>
