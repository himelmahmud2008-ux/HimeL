<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VORTEX 3D Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070512;color:#fff;font:600 15px system-ui;touch-action:none}#view{position:absolute;inset:0}canvas{display:block}#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #000}#hud span{background:#10091dcc;border:1px solid #9b4dff77;border-radius:10px;padding:8px 12px}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08051299;padding:16px;text-align:center}.panel{max-width:390px;padding:24px;border:1px solid #9b4dff;border-radius:18px;background:#160d29ed;box-shadow:0 0 35px #7624cf88}h1{margin:0 0 8px;color:#d9a5ff;letter-spacing:2px}p{color:#c4b4dc;line-height:1.55}button{border:0;border-radius:12px;padding:12px 24px;background:linear-gradient(120deg,#822cff,#d32cff);color:white;font-size:16px;font-weight:800}#controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.ctrl{pointer-events:auto;width:76px;height:58px;border:1px solid #c18aff99;background:#291344dd;color:white;border-radius:16px;font-size:25px;touch-action:none}#error{display:none;color:#ffb6d4;font-size:13px}
</style></head><body>
<div id="view"></div><div id="hud"><span id="gameName">VORTEX 3D</span><span>SCORE: <b id="score">0</b></span></div>
<div id="overlay"><div class="panel"><h1 id="title">VORTEX 3D</h1><p id="instructions"></p><button id="start">PLAY NOW</button><p id="error"></p></div></div>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
(()=>{
const params=new URLSearchParams(location.search),mode=params.get('mode')||'drive';
const configs={
 drive:['NEON DRIFT 3D','Dodge traffic and survive. Change lanes with ← → or A / D.'],
 runner:['CYBER RUNNER 3D','Run through the neon city. Switch lanes and avoid barriers.'],
 space:['GALAXY DEFENDER 3D','Move left and right to dodge asteroids and blast through the star field.'],
 flight:['SKY RUSH 3D','Fly through glowing rings and avoid floating obstacles.']
};
const [name,instructions]=configs[mode]||configs.drive;
const $=s=>document.querySelector(s),host=$('#view'),overlay=$('#overlay'),startBtn=$('#start'),scoreEl=$('#score'),errorEl=$('#error');
$('#title').textContent=name;$('#gameName').textContent=name;$('#instructions').textContent=instructions;
let renderer,scene,camera,player,items=[],marks=[],running=false,score=0,lane=1,targetX=0,spawn=0,clock=new THREE.Clock(),lastShot=0;
const lanes=[-3.2,0,3.2],materials={road:new THREE.MeshStandardMaterial({color:0x100d1d,roughness:.8}),line:new THREE.MeshStandardMaterial({color:0xb36aff,emissive:0x7b24ff,emissiveIntensity:2}),cyan:new THREE.MeshStandardMaterial({color:0x36dfff,emissive:0x08bde8,emissiveIntensity:1.4}),pink:new THREE.MeshStandardMaterial({color:0xff3d9a,emissive:0xd20b69,emissiveIntensity:1.3}),purple:new THREE.MeshStandardMaterial({color:0x9b59ff,emissive:0x7025e8,emissiveIntensity:1.3}),glass:new THREE.MeshStandardMaterial({color:0x152b4b,metalness:.4,roughness:.2}),dark:new THREE.MeshStandardMaterial({color:0x090a12})};
function box(parent,w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);parent.add(o);return o}
function car(color){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.55,metalness:.45,roughness:.3});box(g,1.65,.48,3.1,m,0,.62,0);box(g,1.28,.55,1.48,materials.glass,0,1.08,-.15);box(g,1.5,.12,.28,materials.cyan,0,.48,-1.48);for(const x of [-.86,.86])for(const z of [-.95,.98]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,12),materials.dark);w.rotation.z=Math.PI/2;w.position.set(x,.36,z);g.add(w)}return g}
function init(){
 try{
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x070512);scene.fog=new THREE.Fog(0x070512,30,125);
 camera=new THREE.PerspectiveCamera(58,host.clientWidth/host.clientHeight,.1,200);camera.position.set(0,mode==='flight'?5:8,mode==='space'?15:13);camera.lookAt(0,0,-14);
 scene.add(new THREE.HemisphereLight(0xa99aff,0x100819,2.2));const light=new THREE.DirectionalLight(0xdacaff,2.4);light.position.set(-5,12,8);scene.add(light);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,240),materials.road);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.12,-65);scene.add(ground);
 for(const x of [-6.1,6.1])box(scene,.12,.18,190,materials.cyan,x,.12,-65);
 for(let z=8;z>-170;z-=9)for(const x of [-2,2])marks.push(box(scene,.07,.025,3,materials.line,x,.015,z));
 for(let side of [-1,1])for(let z=-155;z<20;z+=17+Math.random()*10){let h=5+Math.random()*17,b=box(scene,3+Math.random()*4,h,4,new THREE.MeshStandardMaterial({color:side<0?0x17102d:0x101a32,emissive:side<0?0x32105b:0x0b2e55,emissiveIntensity:.5}),side*(10+Math.random()*8),h/2-.1,z)}
 if(mode==='space'){camera.position.set(0,5,15);camera.lookAt(0,0,-20)}
 player=mode==='flight'?new THREE.Group():car(0xa94dff);scene.add(player);player.position.set(0,mode==='flight'?1:0,mode==='space'?7:5);
 if(mode==='flight'){const body=new THREE.Mesh(new THREE.ConeGeometry(.75,2.3,4),materials.cyan);body.rotation.x=Math.PI/2;player.add(body);const wing=box(player,3,.08,.55,materials.pink,0,0,.2)}
 window.addEventListener('resize',resize);animate();
 }catch(e){errorEl.style.display='block';errorEl.textContent='3D graphics could not start. Please use Chrome with hardware acceleration.';startBtn.disabled=true}
}
function resize(){if(!renderer)return;renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}
function obstacle(){
 let lane=Math.floor(Math.random()*3),obj;
 if(mode==='space'){obj=new THREE.Mesh(new THREE.IcosahedronGeometry(.8+Math.random()*.5,1),materials.pink.clone());obj.position.set(lanes[lane],Math.random()*3-1,-100)}
 else if(mode==='flight'){obj=new THREE.Mesh(new THREE.TorusGeometry(2.15,.18,8,24),materials.cyan);obj.position.set(lanes[lane],1,-105);obj.rotation.y=Math.PI/2}
 else{obj=box(new THREE.Group(),1.8,mode==='runner'?2.3:1.1,1.8,materials.pink,0,mode==='runner'?1.15:.55,0);obj=obj.parent;obj.position.set(lanes[lane],0,-105)}
 scene.add(obj);items.push({obj,lane,passed:false})
}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}
function reset(){items.forEach(i=>scene.remove(i.obj));items=[];score=0;spawn=0;lane=1;targetX=0;player.position.x=0;scoreEl.textContent='0';overlay.style.display='none';running=true;clock.getDelta()}
function finish(){running=false;overlay.style.display='grid';$('#title').textContent='GAME OVER';$('#instructions').innerHTML='Your score: <b>'+Math.floor(score)+'</b><br>Try again and beat your score!';startBtn.textContent='PLAY AGAIN'}
function animate(){requestAnimationFrame(animate);if(!renderer)return;const dt=Math.min(clock.getDelta(),.05);if(running){score+=dt*10;scoreEl.textContent=Math.floor(score);const speed=mode==='space'?31:mode==='flight'?28:24;spawn+=dt;if(spawn>(mode==='space'?.65:mode==='flight'?1.05:1.0)){spawn=0;obstacle()}
 marks.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>12)m.position.z=-170});
 player.position.x+=(targetX-player.position.x)*Math.min(1,dt*12);
 items.forEach(it=>{const o=it.obj;o.position.z+=speed*dt;if(mode==='space')o.rotation.x+=dt*1.4;if(mode==='flight'){o.rotation.z+=dt*1.3;if(Math.abs(o.position.z-player.position.z)<2.6&&Math.abs(o.position.x-player.position.x)<1.25&&!it.passed){it.passed=true;score+=30}}else if(Math.abs(o.position.z-player.position.z)<2.1&&Math.abs(o.position.x-player.position.x)<1.45){finish() }});
 items=items.filter(it=>{if(it.obj.position.z>18){scene.remove(it.obj);return false}return true});
 if(mode==='flight')player.rotation.z+=(targetX-player.position.x)*-.035;
 camera.position.x+=(player.position.x*.14-camera.position.x)*dt*2;camera.lookAt(player.position.x*.12,0,-15);
 }renderer.render(scene,camera)}
startBtn.addEventListener('click',reset);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();if(!e.repeat)move(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'?-1:1)}});
$('#left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});$('#right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
init();
})();
</script></body></html>
