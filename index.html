<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VORTEX – Play. Win. Repeat.</title>
<meta name="description" content="VORTEX is a free browser gaming hub with featured, trending and categorized games.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030a;--panel:#0e0a1a;--panel2:#150f28;--line:#2a1f4d;--violet:#8b2bff;--pink:#d62bff;--glow:#b266ff;--text:#ece6fa;--mute:#9a8fb8;--r:16px;
--display:'Chakra Petch','Segoe UI',system-ui,sans-serif;--body:'Outfit','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);line-height:1.15}
section{padding:72px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
.sec-head p{color:var(--mute)}
/* nav */
nav{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(5,3,10,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.5px}
.logo b{color:var(--glow);text-shadow:0 0 18px var(--violet)}
.links{display:flex;gap:6px;align-items:center}
.links a{padding:8px 14px;border-radius:10px;color:var(--mute);transition:.25s}
.links a:hover,.links a.on{color:#fff;background:var(--panel2)}
.nav-search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;transition:.25s}
.nav-search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,43,255,.25)}
.nav-search input{background:none;border:0;color:var(--text);padding:9px 0;width:180px;outline:0;font:inherit}
.burger{display:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line)}
.burger span{display:block;width:18px;height:2px;background:#fff;margin:4px auto;transition:.3s}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;transition:.25s;font-family:var(--display)}
.btn-p{background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 0 22px rgba(139,43,255,.55)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(214,43,255,.8)}
.btn-g{border:1px solid var(--line);background:var(--panel)}
.btn-g:hover{border-color:var(--violet);box-shadow:0 0 18px rgba(139,43,255,.4)}
/* hero */
.hero{position:relative;padding:150px 0 90px;overflow:hidden;min-height:92vh;display:flex;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:
radial-gradient(600px 400px at 80% 20%,rgba(139,43,255,.35),transparent 70%),
radial-gradient(500px 380px at 10% 90%,rgba(214,43,255,.2),transparent 70%),
linear-gradient(rgba(139,43,255,.07) 1px,transparent 1px) 0 0/48px 48px,
linear-gradient(90deg,rgba(139,43,255,.07) 1px,transparent 1px) 0 0/48px 48px;
mask-image:linear-gradient(#000 60%,transparent)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);font-weight:700;letter-spacing:-1px;animation:flick 1.6s .2s both}
.hero h1 span{color:#fff;text-shadow:0 0 12px var(--glow),0 0 40px var(--violet),0 0 80px var(--pink)}
.hero p{color:var(--mute);font-size:1.15rem;max-width:520px;margin:20px 0 32px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.stats{display:flex;gap:32px;margin-top:44px;flex-wrap:wrap}
.stats div{font-family:var(--display);font-size:1.7rem;font-weight:700}
.stats small{display:block;font-family:var(--body);font-size:.85rem;color:var(--mute);font-weight:400}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.2}18%{opacity:1}24%{opacity:.4}30%,100%{opacity:1}}
.stack{position:relative;height:420px;perspective:900px}
.stack .card-mini{position:absolute;width:62%;aspect-ratio:3/4;border-radius:20px;border:1px solid rgba(178,102,255,.5);display:grid;place-items:center;font-size:4.5rem;box-shadow:0 0 40px rgba(139,43,255,.4);animation:float 6s ease-in-out infinite}
.stack .card-mini:nth-child(1){left:0;top:30px;transform:rotateY(18deg) rotate(-6deg)}
.stack .card-mini:nth-child(2){right:0;top:0;transform:rotateY(-14deg) rotate(7deg);animation-delay:-3s}
@keyframes float{50%{translate:0 -16px}}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,border-color .3s,box-shadow .3s;animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.card:hover{transform:translateY(-6px);border-color:var(--violet);box-shadow:0 12px 40px rgba(139,43,255,.35)}
.thumb{position:relative;aspect-ratio:16/10;display:grid;place-items:center;font-size:3.6rem;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 80% 28%),hsl(calc(var(--h) + 50) 90% 8%))}
.thumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 2px,transparent 2px 4px)}
.thumb i{font-style:normal;filter:drop-shadow(0 0 16px hsl(var(--h) 100% 70%));transition:transform .4s;z-index:1}
.card:hover .thumb i{transform:scale(1.25) rotate(-6deg)}
.tag{position:absolute;top:10px;left:10px;z-index:2;font-size:.75rem;padding:3px 10px;border-radius:99px;background:rgba(5,3,10,.7);border:1px solid var(--line);backdrop-filter:blur(6px)}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(5,3,10,.7);font-size:1.05rem;transition:.25s}
.fav:hover{transform:scale(1.15)}.fav.on{color:#ff5bd9;text-shadow:0 0 12px #ff2bd6}
.rank{position:absolute;bottom:4px;left:12px;z-index:2;font-family:var(--display);font-size:2.4rem;font-weight:700;color:transparent;-webkit-text-stroke:1.5px var(--glow)}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:1.15rem}
.body p{color:var(--mute);font-size:.92rem;flex:1}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem}
.meta b{color:#ffd166;font-weight:500}
.body .btn{justify-content:center;padding:10px;margin-top:4px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.feat .card{background:linear-gradient(160deg,var(--panel2),var(--panel))}
.feat .thumb{aspect-ratio:16/9}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cat{padding:22px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:center;transition:.3s}
.cat:hover,.cat.on{border-color:var(--violet);background:var(--panel2);box-shadow:0 0 26px rgba(139,43,255,.4);transform:translateY(-4px)}
.cat.on{outline:1px solid var(--glow)}
.cat span{display:block;font-size:2rem}.cat b{font-family:var(--display)}.cat small{display:block;color:var(--mute)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.tools input,.tools select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:12px;font:inherit;outline:0}
.tools input{flex:1;min-width:200px}
.tools input:focus,.tools select:focus{border-color:var(--violet)}
.count{color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r)}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,1,8,.82);backdrop-filter:blur(8px);display:none;place-items:center;padding:16px}
.modal.open{display:grid}
.dlg{width:min(900px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--violet);border-radius:20px;padding:22px;box-shadow:0 0 60px rgba(139,43,255,.45);animation:pop .35s both}
.dlg-h{display:flex;justify-content:space-between;align-items:start;gap:12px}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);flex:none}.x:hover{border-color:var(--pink)}
.hud{display:flex;justify-content:space-between;margin:16px 0 10px;font-family:var(--display);font-size:1.1rem}
.arena{position:relative;height:300px;border-radius:14px;background:radial-gradient(circle at 50% 50%,#1a0f36,#07040f);border:1px solid var(--line);overflow:hidden;cursor:crosshair;touch-action:manipulation}
.arena.game-frame{height:min(68vh,560px);cursor:default;padding:0}.arena.game-frame iframe{display:block;width:100%;height:100%;border:0;background:#080512}\n.arena .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:20px;pointer-events:none}
.orb{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--glow) 40%,var(--violet));box-shadow:0 0 24px var(--pink);animation:pop .2s both}
.dlg .cta{margin-top:14px}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;translate:-50% 90px;background:var(--panel2);border:1px solid var(--violet);padding:12px 22px;border-radius:12px;z-index:200;transition:.4s;box-shadow:0 0 26px rgba(139,43,255,.5)}
.toast.show{translate:-50% 0}
$("#yr").textContent=new Date().getFullYear();
refreshAll();
</script>
</body>
</html>
